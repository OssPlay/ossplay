# Local development: just the stateful services. Run apps/api, apps/dashboard,
# and apps/worker directly on the host with `bun dev` against these — faster
# iteration than rebuilding Docker images on every change.
name: ossplay-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ossplay
      POSTGRES_PASSWORD: ossplay
      POSTGRES_DB: ossplay
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ossplay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
