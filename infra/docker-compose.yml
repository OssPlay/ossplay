# The self-hosted core control plane (PRD.md §2.1). Deliberately does NOT
# include a worker service — workers are provisioned separately on the
# user's own VPS over SSH (PRD.md §4, ARCHITECTURE.md §3) to keep this
# control plane's compute cost at zero.
name: ossplay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ossplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ossplay}
      POSTGRES_DB: ossplay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ossplay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/ossplay/ossplay:${OSSPLAY_VERSION:-latest}
    environment:
      OSSPLAY_ROLE: api
      DATABASE_URL: postgres://ossplay:${POSTGRES_PASSWORD:-ossplay}@postgres:5432/ossplay
      REDIS_URL: redis://redis:6379
      PORT: 3001
      # Caddy's admin API, reachable only within this compose network (see
      # the `caddy` service's `expose`, not `ports`) — lets the onboarding
      # DNS step and /settings/instance push a new domain into Caddy's live
      # config. Unset in local dev (bun dev, no Docker), which is exactly
      # the signal apps/api/src/lib/caddy/admin.ts uses to no-op instead of
      # attempting an unreachable request.
      OSSPLAY_CADDY_ADMIN_URL: http://caddy:2019
      # Same no-op-when-unset pattern as OSSPLAY_CADDY_ADMIN_URL above, for
      # the updater sidecar (see the `updater` service below and
      # apps/api/src/routes/instance.ts).
      OSSPLAY_UPDATER_URL: http://updater:8787
      OSSPLAY_UPDATER_TOKEN: ${OSSPLAY_UPDATER_TOKEN:?OSSPLAY_UPDATER_TOKEN must be set — install.sh generates one into .env}
      # Instance-wide SMTP/domain settings live in this file, not the DB —
      # see packages/db/src/schema.ts and apps/api/src/lib/config/
      # instance-config.ts. Bind-mounted (below) so it survives container
      # recreation; a SaaS deployment would instead mount a per-tenant
      # file/ConfigMap at this same path.
      OSSPLAY_CONFIG_PATH: /ossplay.yaml
    volumes:
      - ./ossplay.yaml:/ossplay.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dashboard:
    image: ghcr.io/ossplay/ossplay:${OSSPLAY_VERSION:-latest}
    environment:
      OSSPLAY_ROLE: dashboard
      PORT: 3000
      # For the one server-side call (the auth-gate redirect check in
      # middleware.ts) — talks to the api container directly, not through
      # Caddy's public /api/* proxy.
      API_INTERNAL_URL: http://api:3001
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    # 2019 (Caddy's admin API) is deliberately NOT in `ports:` — that would
    # publish config-mutation access to the host/internet. `expose` only
    # makes it reachable at http://caddy:2019 from other services on this
    # compose network (the `api` service, via OSSPLAY_CADDY_ADMIN_URL above).
    expose:
      - "2019"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      OSSPLAY_DOMAIN: ${OSSPLAY_DOMAIN:-localhost}
      # Compose's own ${VAR:-default} always defines the var (even as empty)
      # if unset on the host, which defeats the Caddyfile's own {$VAR:default}
      # fallback — so this default must be non-empty and kept in sync with
      # infra/caddy/Caddyfile's.
      OSSPLAY_ACME_EMAIL: ${OSSPLAY_ACME_EMAIL:-internal@ossplay.local}
    depends_on:
      - api
      - dashboard

  # Docker-outside-of-Docker sidecar (see infra/updater/index.ts, PRD.md
  # §2.2): the API calls this over the compose-internal network to pull a
  # new version, run migrations, and roll the api/dashboard containers.
  # Mounting docker.sock alone isn't enough — `docker compose pull/up` run
  # from in here still talk to the HOST daemon, which resolves this file's
  # own relative volume paths (e.g. ./ossplay.yaml above) against the HOST
  # filesystem. Bind-mounting the install directory at the *same absolute
  # path* inside the container (via $PWD, the directory `docker compose`
  # was invoked from) is what makes those paths line up on both sides — the
  # standard DooD pattern.
  updater:
    image: ghcr.io/ossplay/ossplay:${OSSPLAY_VERSION:-latest}
    environment:
      OSSPLAY_ROLE: updater
      OSSPLAY_UPDATER_TOKEN: ${OSSPLAY_UPDATER_TOKEN:?OSSPLAY_UPDATER_TOKEN must be set — install.sh generates one into .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
    working_dir: ${PWD}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
