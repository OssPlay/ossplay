name: Docker Image

# Publishes to GHCR, not Docker Hub — see ARCHITECTURE.md §8. Zero-config:
# uses the repo's built-in GITHUB_TOKEN, no separate registry account needed.
#
# One Dockerfile (infra/ossplay/Dockerfile), one version to manage — but NOT
# one image. Each self-hosted role (api/dashboard/updater) is its own final
# build stage/target, published as ghcr.io/ossplay/ossplay:<version>-<role> —
# still the same single GHCR *package* (ghcr.io/ossplay/ossplay), just one
# tag per role instead of one tag shared by all of them — so a container for
# one role never carries another role's source (see that Dockerfile's own
# comment for why: exec'ing into, say, the public api container used to also
# expose infra/updater's privileged docker-compose-control code).
#
# `worker` publishes alongside the other three roles — it's what the opt-in
# infra/docker-compose.worker.yml overlay (Drive feature's local/self-hosted
# processing) pulls; infra/docker-compose.yml itself still never runs one by
# default (see that file's own comment on why).
#
# Versioning is tag-derived, never hand-bumped in package.json: pushing
# `v0.0.1` (or a prerelease like `v0.0.1-rc.1`) is the only release step —
# OSSPLAY_VERSION is derived directly from github.ref_name (stripping the
# leading `v`) rather than from docker/metadata-action's `version` output,
# since that output isn't guaranteed suffix-clean once flavor.suffix is in
# play across a matrix. apps/api/src/lib/server-info.ts's readVersion()
# reads this baked-in value at runtime.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [api, dashboard, updater, worker, jobs]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Set a repo variable named GHCR_IMAGE to override (e.g. for a
          # fork) — falls back to the real org image otherwise.
          images: ${{ vars.GHCR_IMAGE || 'ghcr.io/ossplay/ossplay' }}
          # Every tag below (including the auto-generated `latest`) gets
          # -${{ matrix.role }} appended — this is what keeps one image name
          # hosting four independent, role-scoped tags instead of colliding.
          flavor: |
            suffix=-${{ matrix.role }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/ossplay/Dockerfile
          target: runner-${{ matrix.role }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OSSPLAY_VERSION=${{ steps.version.outputs.value }}

  # What install.sh downloads on a fresh box — a pinned self-host stack that
  # pulls the role-tagged images above instead of building from source. Runs
  # once, after every role has actually published, not once per matrix leg
  # (four concurrent legs all creating/attaching to the same GitHub Release
  # would race). Auto-creates/updates the release for this tag if softprops/
  # action-gh-release doesn't find one yet (this is also the "GitHub
  # Releases" half of the update-check source of truth — see
  # apps/api/src/routes/instance.ts). This release's docker-compose.yml is
  # also what infra/updater/index.ts's syncComposeFile re-syncs an already-
  # running instance to before it pulls — that's what carries an existing
  # install across this tag-scheme change without a separate migration step.
  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            infra/docker-compose.yml
            infra/docker-compose.worker.yml
            infra/caddy/Caddyfile
