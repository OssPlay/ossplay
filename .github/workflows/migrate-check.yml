name: Migration Check

on:
  pull_request:
    paths:
      - "packages/db/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: drizzle-kit check
        working-directory: packages/db
        run: bunx drizzle-kit check
